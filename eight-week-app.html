<title>The Eight Week Kitchen</title>
<style>
  :root{
    --ground:#F5F7F2; --surface:#FFFFFF; --surface-alt:#EDF0E8; --sunken:#E4E8DD;
    --ink:#1A1F17; --ink-soft:#414839; --muted:#6B7263;
    --line:#D8DCD0; --line-soft:#E6E9DF;
    --accent:#2E6440; --accent-ink:#FFFFFF; --accent-soft:#E2EDE3;
    --water:#2C6E8F; --water-soft:#DCEBF3;
    --amber:#8A6209; --amber-soft:#F5EBD3;
    --alert:#A5382B; --alert-soft:#F8E5E1;
    --display:Georgia,"Iowan Old Style",Palatino,serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --nav-h:60px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#11140F; --surface:#191D16; --surface-alt:#212619; --sunken:#0C0F0A;
    --ink:#ECEFE5; --ink-soft:#C3C9B8; --muted:#949B89;
    --line:#333A2C; --line-soft:#262C21;
    --accent:#86C596; --accent-ink:#11140F; --accent-soft:#1E2C21;
    --water:#7FC4E8; --water-soft:#152730;
    --amber:#D9AE4E; --amber-soft:#2C2415;
    --alert:#EE9184; --alert-soft:#2E1A16;
  }}
  :root[data-theme="dark"]{
    --ground:#11140F; --surface:#191D16; --surface-alt:#212619; --sunken:#0C0F0A;
    --ink:#ECEFE5; --ink-soft:#C3C9B8; --muted:#949B89;
    --line:#333A2C; --line-soft:#262C21;
    --accent:#86C596; --accent-ink:#11140F; --accent-soft:#1E2C21;
    --water:#7FC4E8; --water-soft:#152730;
    --amber:#D9AE4E; --amber-soft:#2C2415;
    --alert:#EE9184; --alert-soft:#2E1A16;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0;padding:0}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .app{max-width:540px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));min-height:100vh}

  /* header */
  .hdr{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .hdr h1{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0;letter-spacing:-.01em}
  .hdr .prog{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);white-space:nowrap}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  .card.tight{padding:14px 16px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h2.sect{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:24px 0 12px;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 4px}
  p{margin:0 0 10px}
  p:last-child{margin-bottom:0}
  .muted{color:var(--muted);font-size:.88rem}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* water */
  .water-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
  .water-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:2.1rem;font-weight:600;color:var(--water);line-height:1}
  .water-val small{font-size:.95rem;color:var(--muted);font-weight:400}
  .glasses{display:flex;gap:5px;margin-bottom:14px}
  .glass{flex:1;height:34px;border-radius:4px;background:var(--sunken);border:1px solid var(--line);transition:background .15s}
  .glass.on{background:var(--water);border-color:var(--water)}
  .wbtns{display:flex;gap:8px}
  .wbtn{flex:1;padding:11px 0;border-radius:8px;border:1px solid var(--water);background:transparent;color:var(--water);font-weight:600;font-size:.9rem}
  .wbtn.solid{background:var(--water);color:var(--surface);border-color:var(--water)}
  .wbtn.ghost{border-color:var(--line);color:var(--muted);flex:0 0 56px}

  /* meal rows */
  .row{display:grid;grid-template-columns:52px 1fr 30px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:none}
  .row .time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);letter-spacing:-.02em}
  .row .what{min-width:0}
  .row .what b{display:block;font-weight:600;font-size:.95rem;line-height:1.3}
  .row .what span{font-size:.78rem;color:var(--muted)}
  .row .what b.link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
  .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700}
  .tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .row.done .what b{color:var(--muted);text-decoration:line-through}

  /* workout card */
  .wk{border-left:4px solid var(--amber)}
  .wk.rest{border-left-color:var(--line)}
  .wk .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
  .wk.rest .kind{color:var(--muted)}
  .exlist{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--line-soft)}
  .exlist li{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:.9rem}
  .exlist li:last-child{border-bottom:none}
  .exlist b{display:block}
  .exlist span{color:var(--muted);font-size:.83rem}

  /* pills / chips */
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:6px 11px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
  .pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  /* accordion */
  .acc{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .acc>summary{padding:15px 18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:1.15rem;flex:none}
  .acc[open]>summary::after{content:"–"}
  .acc[open]>summary{border-bottom:1px solid var(--line-soft)}
  .acc .body{padding:14px 18px 18px}
  .acc .wname{font-weight:600}
  .acc .wsub{font-size:.8rem;color:var(--muted);display:block;margin-top:2px}
  .acc.now{border-color:var(--accent);border-width:2px}
  .acc.now .wname::after{content:" · NOW";font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.1em}
  .acc.past{opacity:.6}

  /* shop */
  .shopsec{margin-bottom:18px}
  .shopsec h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between}
  .shopsec label{display:grid;grid-template-columns:20px 1fr auto;gap:11px;align-items:center;padding:9px 0;font-size:.92rem;cursor:pointer;border-bottom:1px solid var(--line-soft)}
  .shopsec label:last-child{border-bottom:none}
  .shopsec input{margin:0;width:17px;height:17px;accent-color:var(--accent)}
  .shopsec .pr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
  .shopsec input:checked ~ .it{text-decoration:line-through;color:var(--muted)}

  /* form */
  label.fld{display:block;margin-bottom:14px}
  label.fld span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=date],input[type=number],input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-family:var(--mono)}
  .btn{display:block;width:100%;padding:13px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;margin-bottom:10px}
  .btn.sec{background:transparent;color:var(--accent)}
  .btn.warn{border-color:var(--alert);color:var(--alert);background:transparent}
  .btn:disabled{opacity:.45;cursor:default}

  /* weight log */
  .wlog{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px}
  .wlog label.fld{flex:1;margin:0}
  .wlog .btn{width:auto;padding:11px 18px;margin:0;flex:none}
  .sparkwrap{border:1px solid var(--line);border-radius:8px;background:var(--sunken);padding:10px;margin-bottom:12px}
  .hist{list-style:none;margin:0;padding:0;font-size:.88rem}
  .hist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .hist li:last-child{border-bottom:none}
  .hist .dlt{color:var(--muted)}
  .hist .dlt.down{color:var(--accent)}

  /* note blocks */
  .note{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:12px 14px;font-size:.88rem;margin-bottom:12px}
  .note.warn{border-left-color:var(--amber);background:var(--amber-soft)}
  .note.alert{border-left-color:var(--alert);background:var(--alert-soft)}
  .note p{margin-bottom:6px}

  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
  nav button{flex:1;background:none;border:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;letter-spacing:.04em;font-family:var(--mono);text-transform:uppercase}
  nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--accent)}

  /* recipe sheet */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
  .sheet.open{display:flex}
  .sheet-in{background:var(--ground);width:100%;max-width:540px;margin:0 auto;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}
  .sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  .sheet-hd h3{font-size:1.35rem}
  .closeb{background:var(--surface-alt);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;flex:none;font-size:16px;line-height:1;padding:0}
  .sheet ul,.sheet ol{padding-left:1.15em;font-size:.93rem}
  .sheet li{margin-bottom:7px}

  .hide{display:none}
</style>

<div class="app">
  <div class="hdr">
    <h1>The Eight Week Kitchen</h1>
    <div class="prog" id="progLabel">—</div>
  </div>
  <main id="view"></main>
</div>

<nav id="nav"></nav>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

<script>
/* ============================================================
   The Eight Week Kitchen — program data (gut-settling revision)
   Avoids: almonds, melon, concentrated whey. Soy sauce is fine.
   Structure: 3 weeks low-FODMAP baseline, then 5 structured
   reintroduction challenges — one trigger group at a time.
   Equipment: treadmill (max 3% incline, 6.0 mph), 20 lb dumbbells.
   ============================================================ */

/* ---------- The two techniques the whole plan rests on ---------- */
const TECHNIQUES = [
  { n: 'Garlic-infused oil',
    d: 'The compounds in garlic that cause gas dissolve in water, not oil. So oil carries the flavour and leaves the trouble behind. Warm ½ cup olive oil with 4 smashed garlic cloves over LOW heat for 10 minutes — it should barely bubble. Cool, then fish the cloves out and throw them away. Keeps two weeks in the fridge. Use it anywhere the old recipes said garlic.',
    w: 'Never leave the cloves sitting in the oil at room temperature — that is a genuine botulism risk. Strain them out and refrigerate.' },
  { n: 'Scallion greens only',
    d: 'The white bulb of a scallion behaves like an onion. The green tops do not. Slice the greens, bin the whites, and you get most of the onion flavour with none of the load. Same trick works with leeks — greens yes, white no.',
    w: '' }
];

/* ---------- Recipe bank — all low-FODMAP by default ---------- */
const RECIPES = {
  'oats': {
    n: 'Overnight oats', t: '3 min', k: 370, p: 21, tag: 'breakfast',
    i: ['½ cup rolled oats — not more, oats climb at 1 cup', '½ cup lactose-free milk', '¼ cup lactose-free plain yogurt', '1 tbsp chia seeds, pinch salt', 'Morning: strawberries or blueberries, 1 tbsp pumpkin seeds'],
    s: ['Everything but the fruit into a jar, stir hard, lid, fridge.', 'Good four days. Fruit in the morning — added Sunday it turns to mush.', 'Half a cup of oats is the ceiling. A full cup is a common quiet cause of morning bloating.']
  },
  'yogurt-bowl': {
    n: 'Yogurt bowl', t: '2 min', k: 320, p: 24, tag: 'breakfast',
    i: ['1 cup lactose-free plain yogurt', 'Strawberries or blueberries', '1 tbsp pumpkin seeds', '1 tsp maple syrup', 'Cinnamon'],
    s: ['Everything on top of the yogurt.', 'Maple syrup, not honey — honey is nearly pure fructose and one of the most reliable bloaters there is.']
  },
  'scramble': {
    n: 'Veggie scramble', t: '6 min', k: 380, p: 24, tag: 'breakfast',
    i: ['2 eggs, beaten with salt', 'Roasted zucchini, red pepper and carrot from Sunday', '1 tsp garlic oil', 'Handful spinach', '1 slice sourdough toast, or rice cakes'],
    s: ['Warm the vegetables in the garlic oil first, then pour the eggs over.', 'Low heat, pull the eggs in from the edges every few seconds.', 'Off the heat while they still look underdone — they keep cooking in the pan.', 'Proper slow-fermented sourdough is much gentler than sandwich bread, because the long ferment eats the fructans before you do.']
  },
  'shakshuka': {
    n: 'Shakshuka', t: '15 min', k: 400, p: 26, tag: 'breakfast',
    i: ['2 eggs', '1 cup canned crushed tomatoes', '½ red pepper, greens of 2 scallions', '1 tbsp garlic oil', '1 tsp cumin, 1 tsp smoked paprika', '2 tbsp feta'],
    s: ['Soften the pepper in the garlic oil, 5 minutes. Spices 30 seconds.', 'Tomatoes in, simmer 5 minutes until it thickens and stops looking watery.', 'Two wells with a spoon, an egg in each, lid on, 5–6 minutes.', 'Whites set, yolks loose. Feta and scallion greens over the top.', 'Makes 2. Eat one, fridge the other.']
  },
  'greek-bowl': {
    n: 'Greek chicken bowl', t: '5 min', k: 510, p: 42, tag: 'lunch',
    i: ['¾ cup cooked rice', '5 oz sliced Greek chicken', 'Roasted zucchini, pepper, carrot', '½ cucumber diced, chopped tomato', '2 tbsp feta', '3 tbsp lemon-yogurt sauce'],
    s: ['Rice and chicken in the bowl, microwave 90 seconds with a splash of water and a plate on top.', 'Cold things on top of the warm — the contrast is the point.', 'Sauce at the last second, never before.']
  },
  'texmex-bowl': {
    n: 'Cumin-lime chicken bowl', t: '5 min', k: 520, p: 41, tag: 'lunch',
    i: ['¾ cup rice, lime, chopped cilantro', '5 oz cumin-lime chicken', 'Fresh tomato-scallion salsa', 'Cucumber, shredded carrot', '2 tbsp grated cheddar', 'Lime'],
    s: ['Warm rice and chicken, 2 minutes.', 'Fork the lime and cilantro through the hot rice — it only takes the flavour while warm.', 'Salsa and raw vegetables on top.', 'Jarred salsa is almost always built on onion and garlic. The fresh version takes three minutes and is better anyway.']
  },
  'med-salad': {
    n: 'Chopped salad', t: '8 min', k: 470, p: 38, tag: 'lunch',
    i: ['3 handfuls romaine, chopped small', '5 oz chicken, diced', 'Cucumber, tomato, shredded carrot, red pepper', '2 tbsp feta, 1 hard-boiled egg', 'Dressing: 1 tbsp garlic oil, juice ½ lemon, ½ tsp Dijon, salt'],
    s: ['Chop everything small enough to eat with a spoon. It genuinely tastes better than whole leaves.', 'Shake the dressing in a jar, pour, toss hard.', 'Egg quartered on top.']
  },
  'fried-rice': {
    n: 'Ginger fried rice, egg &amp; edamame', t: '10 min', k: 490, p: 29, tag: 'lunch',
    i: ['1 cup cold cooked rice (day-old is better)', '2 eggs, beaten', '½ cup shelled edamame — half a cup, not more', 'Diced carrot and red pepper', '1 tsp grated ginger, 1 tbsp garlic oil', '2 tbsp soy sauce, scallion greens, 1 tsp sesame oil'],
    s: ['Hot pan. Scramble the eggs 30 seconds until barely set, tip onto a plate.', 'Ginger in the garlic oil 20 seconds, then the cold rice. Press it flat and leave it for a full minute to crisp.', 'Edamame, vegetables and soy sauce in, toss, return the egg, kill the heat.', 'Scallion greens and sesame oil off the heat.', 'Soy sauce is fine — it is fermented and the trouble is gone.']
  },
  'tuna-rice': {
    n: 'Tuna rice bowl', t: '5 min', k: 430, p: 36, tag: 'lunch',
    i: ['1 can tuna in water or olive oil, drained', '¾ cup cooked rice', 'Cucumber, tomato, shredded carrot', 'Scallion greens, parsley', '1 tbsp garlic oil, lemon, salt, pepper'],
    s: ['Flake the tuna, keeping some chunks.', 'Everything into the bowl, garlic oil and lemon over, toss.', 'Sits happily for a couple of hours, so it travels.']
  },
  'chicken-soup': {
    n: 'Chicken &amp; rice soup', t: 'Sunday batch', k: 420, p: 34, tag: 'batch',
    i: ['1 lb chicken thighs, diced', '3 carrots, 2 zucchini, diced', '½ cup rice', '2 tbsp garlic oil, scallion greens', '6 cups water + 2 tsp salt, 1 tsp thyme, 1 bay leaf', 'Lemon at the end'],
    s: ['Brown the chicken in the garlic oil. Carrots and zucchini in, 5 minutes.', 'Water, salt, thyme, bay leaf. Simmer 20 minutes.', 'Rice in for the last 15 minutes.', 'Lemon and scallion greens at the end, off the heat.', 'Water, not boxed broth — nearly every carton is built on onion. This tastes better than it has any right to.', 'Makes 5. Freeze two.']
  },
  'turkey-chili': {
    n: 'Turkey chili, no beans', t: 'Sunday batch', k: 430, p: 36, tag: 'batch',
    i: ['1¼ lb 93% ground turkey', '2 red peppers, 2 carrots, diced small', '2 tbsp garlic oil, scallion greens', '1 tbsp cumin, 1 tbsp chili powder, 2 tsp smoked paprika, 1 tsp oregano', '28 oz crushed tomatoes', '1 cup water', 'Lactose-free yogurt, lime, cheddar to serve'],
    s: ['Brown the turkey hard in the garlic oil — leave it undisturbed until it sticks, then scrape. Colour is flavour.', 'Peppers and carrots in, 5 minutes. Spices 30 seconds until fragrant.', 'Tomatoes and water. Simmer uncovered 25 minutes.', 'The extra quarter pound of turkey and the diced carrot replace what the beans were doing — bulk and body. You will not miss them.', 'Makes 5. Freeze two.']
  },
  'sheetpan-chicken': {
    n: 'Sheet-pan chicken &amp; vegetables', t: '25 min', k: 480, p: 42, tag: 'dinner',
    i: ['Chicken thighs from the prep tray', 'Roasted zucchini, pepper, carrot', 'Lemon or lime', 'Lemon-yogurt sauce'],
    s: ['Sunday dinner, eaten straight off the prep pan while everything else cools.', 'The one meal of the week you do not have to think about.']
  },
  'shrimp-stirfry': {
    n: 'Ginger shrimp stir-fry', t: '12 min', k: 490, p: 42, tag: 'dinner',
    i: ['6 oz frozen shrimp, thawed and patted VERY dry', '½ cup shelled edamame', 'Red pepper, carrot, bok choy, green beans', '1 tbsp garlic oil', '3 tbsp ginger-scallion soy sauce', '¾ cup cooked rice'],
    s: ['Dry shrimp is non-negotiable — wet shrimp steams grey instead of searing.', 'Screaming hot pan, shrimp in a single layer. 90 seconds a side, then out.', 'Vegetables and edamame in, 3–4 minutes, still with bite.', 'Shrimp back, sauce over, toss 30 seconds. Over rice.']
  },
  'miso-salmon': {
    n: 'Miso-glazed salmon &amp; green beans', t: '15 min', k: 500, p: 40, tag: 'dinner',
    i: ['6 oz salmon fillet', '2 handfuls green beans', '1 tbsp white miso', '1 tbsp soy sauce, 2 tsp maple syrup', '1 tsp grated ginger, garlic oil'],
    s: ['Oven 425°F. Green beans on the pan with oil and salt, 8 minutes alone.', 'Whisk miso, soy sauce, maple and ginger into a thick glaze.', 'Push the beans aside, salmon on the same pan, half the glaze over. Back in 9–11 minutes.', 'Rest of the glaze for the last 2 minutes. Broil for caramelised edges if you like — but stand there, it burns in forty seconds.', 'Green beans instead of broccoli. Broccoli stalks in particular are a reliable bloater and this is a straight swap.']
  },
  'salmon-rice': {
    n: 'Salmon rice bowl', t: '12 min', k: 510, p: 40, tag: 'dinner',
    i: ['6 oz salmon, cubed', '¾ cup rice', '½ cucumber, thin sliced', 'Shredded carrot, scallion greens', '3 tbsp ginger-scallion soy sauce', 'Sesame seeds'],
    s: ['Cube the salmon, toss in a little soy sauce and oil.', 'Hot pan, 2 minutes a side. Slightly rare in the middle — it keeps cooking.', 'Over warm rice with everything cold piled around it.', 'The temperature contrast is what makes this better than it sounds.']
  },
  'street-tacos': {
    n: 'Street tacos', t: '8 min', k: 500, p: 38, tag: 'dinner',
    i: ['5 oz chicken or pork from Sunday, chopped', '3 corn tortillas', 'Shredded lettuce and carrot, lime, cilantro', 'Fresh tomato-scallion salsa'],
    s: ['Char the tortillas over a flame or in a dry pan, 20 seconds a side. This is the difference between a taco and a wrap.', 'Warm the meat in the same pan.', 'Build: meat, slaw, salsa, cilantro, hard squeeze of lime.', 'Corn tortillas, not flour — corn is gentle, wheat flour is not.']
  },
  'pasta': {
    n: 'Tomato pasta, turkey meatballs', t: '15 min', k: 560, p: 38, tag: 'dinner',
    i: ['2 oz dry rice pasta or gluten-free pasta', '5 oz ground turkey, rolled into 8 small balls with salt, pepper, oregano', '2 tbsp garlic oil', '1 cup crushed tomatoes', '2 handfuls baby spinach', 'Grated parmesan'],
    s: ['Pasta water on first. Everything else times off it.', 'Meatballs in the garlic oil, brown all over, 6 minutes. Out.', 'Tomatoes into the same pan, simmer.', 'Meatballs back, spinach on top, lid 2 minutes to wilt.', 'Drained pasta INTO the sauce, not sauce onto pasta. Splash of pasta water, parmesan, toss.', 'Rice pasta for now because of the wheat, not the gluten. Read the note in the Plan tab before you decide anything permanent about wheat.']
  },
  'korean-beef': {
    n: 'Soy-ginger beef bowl', t: '12 min', k: 530, p: 40, tag: 'dinner',
    i: ['5 oz 93% ground beef', '¾ cup rice', '1 tsp grated ginger, 1 tbsp garlic oil', '2 tbsp soy sauce, 1 tsp maple syrup, 1 tsp sesame oil', 'Shredded carrot, cucumber, scallion greens', 'Fried egg on top (optional, +6g protein)'],
    s: ['Brown the beef hard in a dry pan — it has enough fat. Break it up small.', 'Ginger in for 30 seconds once the beef is browned, not before, or it burns.', 'Soy sauce and maple in, bubble down 60 seconds until it coats.', 'Over rice with the raw vegetables. Sesame oil off the heat.']

const SCHEDULE = {
  breakfast:'07:00', snack1:'15:30', lunch:'12:30', workout:'17:15',
  dinner:'18:30', postwalk:'19:30', close:'20:30', prep:'10:00', shop:'09:30'
};


/* ================= storage (degrades gracefully) ================= */
var MEM = {}, STORE_OK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ STORE_OK = false; }
function sget(k, dflt){
  try { var v = STORE_OK ? localStorage.getItem('8wk:'+k) : MEM[k];
        return v == null ? dflt : JSON.parse(v); } catch(e){ return dflt; }
}
function sset(k, v){
  var s = JSON.stringify(v);
  try { if (STORE_OK) localStorage.setItem('8wk:'+k, s); else MEM[k] = s; } catch(e){ MEM[k] = s; }
}

/* ================= settings ================= */
var S = Object.assign({ start:'2026-08-16', waterGoal:100, weight:null }, sget('settings', {}));
function saveS(){ sset('settings', S); }

/* ================= dates ================= */
var DAYNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayKey(){ return ymd(new Date()); }
function dayIndex(dateKey){
  var a = parseYmd(S.start), b = parseYmd(dateKey);
  return Math.round((b - a) / 86400000);
}
/* returns {week, dow, block, inProgram} */
function position(dateKey){
  var i = dayIndex(dateKey);
  var inProg = i >= 0 && i < 56;
  var clamped = Math.max(0, Math.min(55, i));
  return { idx:i, inProgram:inProg, week:Math.floor(clamped/7)+1, dow:((clamped%7)+7)%7,
           block:Math.min(3, Math.floor(Math.floor(clamped/7)/2)) };
}
function pretty(dateKey){
  var d = parseYmd(dateKey);
  return d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
function hhmm(t){
  var p = t.split(':'), h = +p[0], m = p[1], ap = h >= 12 ? 'pm' : 'am', h12 = h % 12 || 12;
  return h12 + ':' + m + ap;
}

/* ================= per-day state ================= */
function water(k){ return sget('w:'+k, 0); }
function setWater(k,v){ sset('w:'+k, Math.max(0, v)); }
function meals(k){ return sget('m:'+k, {}); }
function toggleMeal(k, slot){ var m = meals(k); m[slot] = !m[slot]; sset('m:'+k, m); }
function workoutDone(k){ return sget('x:'+k, false); }
function toggleWorkout(k){ sset('x:'+k, !workoutDone(k)); }
function symptoms(k){ return sget('sy:'+k, null); }
function setSymptom(k, which, val){
  var s = symptoms(k) || {};
  s[which] = (s[which] === val) ? null : val;
  sset('sy:'+k, s);
}
/* gut phase for a program week */
function phaseFor(week){ return PHASES[Math.max(0, Math.min(7, week-1))]; }
/* challenge days are Mon/Tue/Wed of a challenge week */
function challengeDay(week, dow){
  var ph = phaseFor(week);
  if (!ph.ch || dow < 1 || dow > 3) return null;
  return { key: ph.ch, def: REINTRO[ph.ch], dose: REINTRO[ph.ch].d[dow-1], n: dow };
}

function waterGoalFor(dateKey){
  var p = position(dateKey);
  var t = TRAINING[p.week-1].days[p.dow].ty;
  return S.waterGoal + ((t === 'strength' || t === 'intervals' || t === 'walk') ? 20 : 0);
}

/* ================= helpers ================= */
function esc(s){ return String(s).replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;').replace(/</g,'&lt;'); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d; }

/* ================= views ================= */
var TAB = 'today';
var VIEW = document.getElementById('view');

function mealRow(time, label, name, slot, dateKey, recipeId){
  var done = !!meals(dateKey)[slot];
  return '<div class="row'+(done?' done':'')+'">'
    + '<div class="time">'+hhmm(time)+'</div>'
    + '<div class="what"><b'+(recipeId?' class="link" data-recipe="'+recipeId+'"':'')+'>'+name+'</b>'
    + '<span>'+label+'</span></div>'
    + '<button class="tick'+(done?' on':'')+'" data-meal="'+slot+'" data-date="'+dateKey+'" aria-label="Mark '+label+' done">✓</button>'
    + '</div>';
}

  }

  out += '<div class="card"><p class="eyebrow">Eat · block '+blk.id+', '+blk.name+'</p>'
      + mealRow(SCHEDULE.breakfast,'Breakfast', RECIPES[day.b].n, 'b', k, day.b)
      + mealRow(SCHEDULE.lunch,'Lunch', RECIPES[day.l].n, 'l', k, day.l)
      + mealRow(SCHEDULE.snack1,'Only snack of the day', SNACKS[day.s].n, 's1', k, null)
      + mealRow(SCHEDULE.dinner,'Dinner', RECIPES[day.dn].n, 'dn', k, day.dn)
      + mealRow(SCHEDULE.postwalk,'After dinner', 'Ten minute walk', 'pw', k, null)
      + '<p class="muted" style="margin-top:12px">Three meals, one snack, nothing in between — the gut runs a cleaning wave between meals and grazing switches it off. Kitchen closes '+hhmm(SCHEDULE.close)+'.</p>'
      + '</div>';

  /* symptom log */
  var sy = symptoms(k) || {};
  out += '<div class="card"><p class="eyebrow">Tonight\'s score</p>';
  [['bloat','Bloating'],['gas','Gas']].forEach(function(pair){
    out += '<div style="margin-bottom:12px"><div class="muted" style="font-size:.85rem;margin-bottom:6px">'+pair[1]+'</div><div class="pillrow" style="margin:0">';
    ['None','Mild','Moderate','Bad'].forEach(function(lab, v){
      out += '<button class="pill'+(sy[pair[0]] === v ? ' on' : '')+'" data-sym="'+pair[0]+'" data-val="'+v+'" style="flex:1">'+lab+'</button>';
    });
    out += '</div></div>';
  });
  out += '<p class="muted">Score it at the same time each evening. One bad day means nothing; a pattern across a week means everything.</p></div>';

  var isRest = td.ty === 'rest', isPrep = td.ty === 'prep';
  var slot = isPrep ? SCHEDULE.prep : (td.ty === 'walk' || td.ty === 'intervals') ? '07:30' : SCHEDULE.workout;
  out += '<div class="card wk'+(isRest?' rest':'')+'">'

      + '<h3>'+td.t+'</h3>'

  if (td.k){

    out += '</ul>';
    out += '<div class="note warn" style="margin-top:12px"><p><b>This week:</b> '+tr.load+'</p></div>';
  }
  if (!isRest){
    out += '<button class="btn '+(workoutDone(k)?'':'sec')+'" data-workout="'+k+'" style="margin-top:12px">'
        + (workoutDone(k)?'✓ Done':'Mark done')+'</button>';
  }
  out += '</div>';

  out += '<div class="card tight"><p class="eyebrow">This week · '+ph.ph.toLowerCase()+'</p><p>'+ph.note+'</p>'
      + '<p class="muted" style="margin-top:8px">'+tr.focus+'</p></div>';

}

function symptomChart(){
  var start = parseYmd(S.start), rows = [], any = false;
  for (var i = 0; i < 56; i++){
    var d = new Date(start); d.setDate(d.getDate()+i);
    var s = symptoms(ymd(d));
    var v = s ? Math.max(s.bloat == null ? -1 : s.bloat, s.gas == null ? -1 : s.gas) : -1;
    if (v >= 0) any = true;
    rows.push(v);
  }
  if (!any) return '';
  var cols = ['var(--line)','var(--accent)','#B8A33A','var(--amber)','var(--alert)'];
  var h = '<div class="card"><p class="eyebrow">Eight weeks of symptoms</p><div style="display:grid;grid-template-columns:repeat(28,1fr);gap:2px">';
  rows.forEach(function(v, i){
    var wk = Math.floor(i/7)+1;
    h += '<div title="Week '+wk+'" style="aspect-ratio:1;border-radius:2px;background:'+(v<0?'var(--sunken)':cols[v+1])+'"></div>';
  });
  h += '</div><div class="muted" style="display:flex;gap:10px;margin-top:10px;font-size:.78rem;flex-wrap:wrap">';
  ['none','mild','moderate','bad'].forEach(function(l, i){
    h += '<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+cols[i+1]+';margin-right:4px"></span>'+l+'</span>';
  });
  h += '</div><p class="muted" style="margin-top:10px">Two rows per week, left to right. This grid is the thing to photograph and take to a doctor.</p></div>';
  return h;
}

  if (weights.length > 1) out += sparkline(weights);
  if (weights.length){
    out += '<ul class="hist">';
    weights.slice().reverse().slice(0, 12).forEach(function(w, i, arr){
      var prev = arr[i+1], d = prev ? (w.v - prev.v) : null;
      out += '<li><span>'+w.d+'</span><span>'+w.v.toFixed(1)+' lb'
          + (d !== null ? ' <span class="dlt'+(d<0?' down':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</span>' : '')
          + '</span></li>';
    });
    out += '</ul>';
    out += '<p class="muted" style="margin-top:10px">Weigh in once a week, same morning, same conditions. Daily weight swings three pounds on water alone and will only annoy you.</p>';
  } else {
    out += '<p class="muted">Log your first weight on Sunday morning before breakfast. Then once a week, same time, same conditions.</p>';
  }
  out += '</div>';

  out += '<div class="card"><p class="eyebrow">Calendar</p>'
    + '<p>The lean version: workouts, Sunday prep, shopping, weigh-ins, challenge doses, and one repeating nightly reminder to score your symptoms. Meals are in the app rather than your calendar.</p>'
    + '<button class="btn" id="btnCal">Save calendar file</button>'
    + '<div id="calMsg"></div>'
    + '<div class="note warn"><p><b>Android:</b> the file saves as <span class="num">.txt</span> because that is all this page is allowed to hand you. Rename it to <span class="num">eight-week.ics</span> in Files, then open it — Google Calendar takes it from there.</p>'
    + '<p>Import into a <b>new, separate calendar</b> rather than your main one. Then you can hide or delete the whole set in one action instead of one at a time.</p></div></div>';

  out += '<div class="card"><p class="eyebrow">Your data</p>'
    + '<p class="muted">Everything lives on this phone only. Nothing is uploaded anywhere.</p>'
    + '<button class="btn sec" id="btnExport">Back up my log</button>'
    + '<button class="btn warn" id="btnReset">Reset all tracking</button></div>';

  out += '<div class="card"><p class="eyebrow">Keep it on your home screen</p>'
    + '<p>Chrome menu (⋮) → <b>Add to Home screen</b>. It gets an icon and opens without the browser bar.</p></div>';

  out += '<div class="note alert"><p><b>Almonds, melon, concentrated whey.</b> No shakes, no whey powder, no whey-loaded protein bars, and check labels on "high protein" yogurt. Ordinary dairy stays in.</p></div>';
  out += '<p class="muted">Calorie and protein figures are planning estimates. General food and fitness guidance, not medical advice — if you have a condition, take medication, or something hurts, talk to a doctor.</p>';
  return out;
}

function sparkline(weights){
  var vals = weights.map(function(w){ return w.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var rng = (max - min) || 1, W = 300, H = 60, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + i * (W - pad*2) / Math.max(1, vals.length - 1);
    var y = pad + (max - v) / rng * (H - pad*2);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var last = pts[pts.length-1].split(',');
  return '<div class="sparkwrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" height="60" preserveAspectRatio="none" aria-label="Weight trend">'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.5" fill="var(--accent)"/></svg>'
    + '<div class="muted num" style="display:flex;justify-content:space-between;margin-top:4px">'
    + '<span>'+min.toFixed(1)+' lb</span><span>'+max.toFixed(1)+' lb</span></div></div>';
}

/* ================= recipe sheet ================= */
function openRecipe(id){
  var r = RECIPES[id]; if (!r) return;
  var h = '<div class="sheet-hd"><div><h3>'+r.n+'</h3>'
    + '<p class="muted num">'+r.t+(r.k?' · '+r.k+' kcal · '+r.p+'g protein':'')+'</p></div>'
    + '<button class="closeb" id="sheetClose" aria-label="Close">✕</button></div>';
  h += '<p class="eyebrow" style="margin-top:16px">Ingredients</p><ul>';
  r.i.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul><p class="eyebrow" style="margin-top:16px">Method</p><ol>';
  r.s.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ol>';
  document.getElementById('sheetIn').innerHTML = h;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }

/* ================= calendar ================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function icsStamp(d){
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
}
function atTime(base, hhmmStr, addMin){
  var p = hhmmStr.split(':'), d = new Date(base);
  d.setHours(+p[0], +p[1] + (addMin||0), 0, 0);
  return d;
}
function fold(line){
  if (line.length <= 74) return line;
  var out = line.slice(0,74), rest = line.slice(74);
  while (rest.length > 73){ out += '\r\n ' + rest.slice(0,73); rest = rest.slice(73); }
  return out + '\r\n ' + rest;
}
function buildICS(){
  var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Eight Week Kitchen//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Eight Week Kitchen'];
  var uid = 0;
  function ev(start, end, title, desc, alarmMin){
    uid++;
    L.push('BEGIN:VEVENT');
    L.push('UID:8wk-'+uid+'-'+icsStamp(start)+'@eightweekkitchen');
    L.push('DTSTAMP:'+icsStamp(new Date())+'Z');
    L.push('DTSTART:'+icsStamp(start));
    L.push('DTEND:'+icsStamp(end));
    L.push(fold('SUMMARY:'+title.replace(/[,;\\]/g, function(c){ return '\\'+c; })));
    if (desc) L.push(fold('DESCRIPTION:'+desc.replace(/[,;\\]/g, function(c){ return '\\'+c; }).replace(/\n/g,'\\n')));
    if (alarmMin != null){
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title.replace(/[,;\\]/g,''),'TRIGGER:-PT'+alarmMin+'M','END:VALARM');
    }
    L.push('END:VEVENT');
  }

  var start = parseYmd(S.start);
  for (var i = 0; i < 56; i++){
    var d = new Date(start); d.setDate(d.getDate() + i);
    var week = Math.floor(i/7) + 1, dow = i % 7, blk = BLOCKS[Math.min(3, Math.floor(Math.floor(i/7)/2))];
    var tr = TRAINING[week-1], td = tr.days[dow];

    if (td.ty === 'prep'){
      ev(atTime(d, '07:00'), atTime(d, '07:00', 5), 'Weigh in',
         'Same morning, same conditions, before breakfast.', 0);
      ev(atTime(d, SCHEDULE.shop), atTime(d, SCHEDULE.shop, 45), 'Shop · block ' + blk.id + ' list',
         'Two weeks of food in one trip. Full list is in the app.', 30);
      ev(atTime(d, SCHEDULE.prep), atTime(d, SCHEDULE.prep, 110), 'Meal prep · ' + blk.name,
         blk.prep.join('\n').replace(/&amp;/g,'&'), 15);
    } else if (td.ty !== 'rest'){
      var slot = (td.ty === 'walk' || td.ty === 'intervals') ? '07:30' : SCHEDULE.workout;
      var mins = td.ty === 'strength' ? 40 : 45;
      var desc = td.d;
      if (td.k) desc += '\n\n' + LIFTS[td.k].ex.map(function(e){ return '• ' + e.n; }).join('\n') + '\n\n' + tr.load;
      ev(atTime(d, slot), atTime(d, slot, mins), 'Week ' + week + ' · ' + td.t, desc, 20);
    }

    var ch = challengeDay(week, dow);
    if (ch){
      ev(atTime(d, SCHEDULE.breakfast), atTime(d, SCHEDULE.breakfast, 20),
         'Challenge ' + ch.n + '/3 · ' + ch.def.n.replace(/&amp;/g,'&'),
         ch.dose + '\n\nEverything else stays the same as last week.', 10);
    }
  }
  /* one repeating nightly reminder instead of 112 separate ones */
  var last = new Date(start); last.setDate(last.getDate() + 55);
  uid++;
  L.push('BEGIN:VEVENT');
  L.push('UID:8wk-log@eightweekkitchen');
  L.push('DTSTAMP:' + icsStamp(new Date()) + 'Z');
  L.push('DTSTART:' + icsStamp(atTime(start, '21:00')));
  L.push('DTEND:' + icsStamp(atTime(start, '21:00', 5)));
  L.push('RRULE:FREQ=DAILY;COUNT=56');
  L.push('SUMMARY:Score bloating and gas');
  L.push('DESCRIPTION:Open the app and log tonight. The pattern across a week is the point\\, not any single day.');
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Score bloating and gas','TRIGGER:-PT0M','END:VALARM');
  L.push('END:VEVENT');

  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

async function saveCalendar(){
  var msg = document.getElementById('calMsg');
  msg.innerHTML = '<p class="muted">Preparing…</p>';
  var dl = await claude.use('downloads');
  if (!dl){ msg.innerHTML = '<div class="note alert"><p>Saving files is not available in this view. Ask Claude to send you the calendar file directly instead.</p></div>'; return; }
  try {
    await dl.save({ filename:'eight-week-kitchen.ics.txt', data: buildICS() });
    msg.innerHTML = '<div class="note"><p><b>Saved.</b> Rename it to <span class="num">eight-week.ics</span> and open it.</p></div>';
  } catch(e){
    var c = e && e.code;
    msg.innerHTML = '<div class="note alert"><p>'
      + (c === 'declined' ? 'Cancelled — nothing saved.'
        : c === 'too_large' ? 'File too large.'
        : 'Could not save (' + (c || 'unknown') + '). Ask Claude to send you the calendar file directly.')
      + '</p></div>';
  }
}

async function exportData(){
  var dl = await claude.use('downloads');
  var dump = { settings:S, weights:sget('weights',[]), exported:todayKey(), days:{} };
  var start = parseYmd(S.start);
  for (var i = 0; i < 56; i++){
    var d = new Date(start); d.setDate(d.getDate()+i);
    var k = ymd(d), w = water(k), m = meals(k), x = workoutDone(k), sy = symptoms(k);
    if (w || Object.keys(m).length || x || sy) dump.days[k] = { water:w, meals:m, workout:x, symptoms:sy };
  }
  if (!dl){ alert('Saving is not available here. Your data is safe on this device.'); return; }
  try { await dl.save({ filename:'eight-week-log.json', data: JSON.stringify(dump, null, 2) }); } catch(e){}
}

/* ================= nav + events ================= */
var TABS = [
  ['today','Today','M3 10h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
  ['plan','Plan','M8 3v4M16 3v4M4 11h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z'],
  ['food','Food','M7 3v9a3 3 0 0 0 6 0V3M10 12v9M17 3c-1.5 2-2 4-2 6s.5 3 2 3v9'],
  ['shop','Shop','M6 6h15l-1.5 9h-12zM6 6L5 3H2M9 20a1 1 0 1 0 2 0 1 1 0 1 0-2 0M17 20a1 1 0 1 0 2 0 1 1 0 1 0-2 0'],
  ['me','Me','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0']
];
function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'
      + '<svg viewBox="0 0 24 24"><path d="'+t[2]+'"/></svg>'+t[1]+'</button>';
  }).join('');
}
function render(){
  var p = position(todayKey());
  document.getElementById('progLabel').textContent =
    p.inProgram ? ('Week ' + p.week + ' · Day ' + (p.idx+1)) : (p.idx < 0 ? 'Not started' : 'Complete');
  VIEW.innerHTML = TAB === 'today' ? renderToday()
    : TAB === 'plan' ? renderPlan()
    : TAB === 'food' ? renderFood()
    : TAB === 'shop' ? renderShop() : renderMe();
  renderNav();
  window.scrollTo(0, 0);
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-water],[data-meal],[data-workout],[data-recipe],[data-block],[data-shop],[data-sym]');
  if (t){
    if (t.dataset.tab){ TAB = t.dataset.tab; render(); return; }
    if (t.dataset.water){ var k = todayKey(); setWater(k, water(k) + (+t.dataset.water)); render(); return; }
    if (t.dataset.meal){ toggleMeal(t.dataset.date, t.dataset.meal); render(); return; }
    if (t.dataset.workout){ toggleWorkout(t.dataset.workout); render(); return; }
    if (t.dataset.recipe){ openRecipe(t.dataset.recipe); return; }
    if (t.dataset.sym){ setSymptom(todayKey(), t.dataset.sym, +t.dataset.val); render(); return; }
    if (t.dataset.block){ window.__foodBlock = +t.dataset.block; render(); return; }
    if (t.dataset.shop){ window.__shopBlock = +t.dataset.shop; render(); return; }
  }
  if (e.target.id === 'sheetClose' || e.target.id === 'sheet'){ closeSheet(); return; }
  if (e.target.id === 'btnCal'){ saveCalendar(); return; }
  if (e.target.id === 'btnExport'){ exportData(); return; }
  if (e.target.id === 'btnReset'){
    if (confirm('Erase all water, check-offs and weight entries? The plan itself stays.')){
      try { Object.keys(localStorage).filter(function(k){ return k.indexOf('8wk:') === 0 && k !== '8wk:settings'; })
            .forEach(function(k){ localStorage.removeItem(k); }); } catch(err){}
      MEM = {}; render();
    }
    return;
  }
  if (e.target.id === 'addWeight'){
    var f = document.getElementById('fWeight'), v = parseFloat(f.value);
    if (!isNaN(v) && v > 0){
      var ws = sget('weights', []);
      ws = ws.filter(function(w){ return w.d !== todayKey(); });
      ws.push({ d: todayKey(), v: v });
      ws.sort(function(a,b){ return a.d < b.d ? -1 : 1; });
      sset('weights', ws); S.weight = v; saveS(); render();
    }
    return;
  }
});

document.addEventListener('change', function(e){
  if (e.target.id === 'fStart'){ S.start = e.target.value; saveS(); render(); }
  if (e.target.id === 'fWater'){ S.waterGoal = Math.max(40, +e.target.value || 100); saveS(); render(); }
  if (e.target.dataset && e.target.dataset.shopitem){
    var parts = e.target.dataset.shopitem.split('|');
    var map = sget('shop:'+parts[0], {});
    map[parts[1]] = e.target.checked;
    sset('shop:'+parts[0], map);
    var hd = document.querySelector('.water-val');
    if (hd){ var keep = TAB; render(); TAB = keep; }
  }
});

render();
</script>
